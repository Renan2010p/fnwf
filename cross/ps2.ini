[binaries]
c = 'mips64r5900el-ps2-elf-gcc'
cpp = 'mips64r5900el-ps2-elf-g++'
ar = 'mips64r5900el-ps2-elf-ar'
strip = 'mips64r5900el-ps2-elf-strip'
pkgconfig = 'pkg-config'

[built-in options]
c_args = ['-D_EE', '-DPS2', '-D__PS2__', '-G0', '-O2']
cpp_args = ['-D_EE', '-DPS2', '-D__PS2__', '-G0', '-O2', '-Dmain=SDL_main']
c_link_args = ['-T$PS2SDK/ee/startup/linkfile', '-Wl,-zmax-page-size=128', '-nostartfiles', '$PS2SDK/ee/startup/crt0.o', '-Wl,--whole-archive', '-lSDL2main', '-Wl,--no-whole-archive', '-L$PS2SDK/ee/lib', '-L$PS2SDK/ports/lib', '-L$PS2DEV/gsKit/lib']
cpp_link_args = ['-T$PS2SDK/ee/startup/linkfile', '-Wl,-zmax-page-size=128', '-nostartfiles', '$PS2SDK/ee/startup/crt0.o', '-Wl,--whole-archive', '-lSDL2main', '-Wl,--no-whole-archive', '-L$PS2SDK/ee/lib', '-L$PS2SDK/ports/lib', '-L$PS2DEV/gsKit/lib']
default_library = 'static'
buildtype = 'release'
cpp_std = 'c++23'

[host_machine]
system = 'none'
cpu_family = 'mips64'
cpu = 'r5900'
endian = 'little'
