[binaries]
c = 'mips64r5900el-ps2-elf-gcc'
cpp = 'mips64r5900el-ps2-elf-g++'
ar = 'mips64r5900el-ps2-elf-ar'
strip = 'mips64r5900el-ps2-elf-strip'
pkgconfig = 'pkg-config'

[built-in options]
c_args = []
cpp_args = []
c_link_args = ['-T$PS2SDK/ee/startup/linkfile', '-L$PS2SDK/ee/lib', '-L$PS2SDK/ports/lib', '-L$PS2DEV/gsKit/lib']
cpp_link_args = ['-T$PS2SDK/ee/startup/linkfile', '-L$PS2SDK/ee/lib', '-L$PS2SDK/ports/lib', '-L$PS2DEV/gsKit/lib']
default_library = 'static'
buildtype = 'release'
cpp_std = 'c++23'

[host_machine]
system = 'none'
cpu_family = 'mips64'
cpu = 'r5900'
endian = 'little'
