# Meson cross-compilation file for PlayStation 2
# Usage: meson setup builddir --cross-file cross/ps2.ini
#
# Requires: ps2dev toolchain (https://github.com/ps2dev)
#   export PS2SDK=$PS2DEV/ps2sdk
#   export PATH=$PS2DEV/bin:$PATH

[binaries]
c = 'mips64r5900-ee-gcc'
cpp = 'mips64r5900-ee-g++'
ar = 'mips64r5900-ee-ar'
strip = 'mips64r5900-ee-strip'
pkgconfig = 'pkg-config'

[properties]
# PS2 flags: MIPS R5900 (Emotion Engine)
# -march=r5900    : Target the EE CPU
# -mabi=eabi      : Use the EABI calling convention
# -mgp32          : Use 32-bit GP registers (EE native)
# -mfp32          : Use 32-bit FP registers (no double FPU!)
# -G0             : Don't use GP-relative addressing (needed for large binaries)
c_args = [
    '-D__PS2__',
    '-DPS2',
    '-march=r5900',
    '-mabi=eabi',
    '-mgp32',
    '-mfp32',
    '-G0',
    '-fno-exceptions',
    '-fno-rtti',
    '-fno-strict-aliasing',
    '-O2',
    '-DNDEBUG',
]
cpp_args = [
    '-D__PS2__',
    '-DPS2',
    '-march=r5900',
    '-mabi=eabi',
    '-mgp32',
    '-mfp32',
    '-G0',
    '-fno-exceptions',
    '-fno-rtti',
    '-fno-strict-aliasing',
    '-std=c++17',
    '-O2',
    '-DNDEBUG',
]
c_link_args = [
    '-march=r5900',
    '-mabi=eabi',
    '-mgp32',
    '-mfp32',
    '-G0',
    '-L$PS2SDK/ee/lib',
    '-L$PS2SDK/common/lib',
    '-lfileXio',
    '-lmc',
    '-lpad',
    '-laudsrv',
    '-lSDL',
    '-lSDL_ttf',
    '-lSDL_mixer',
    '-lpatches',
    '-lc',
    '-lkernel',
]
cpp_link_args = [
    '-march=r5900',
    '-mabi=eabi',
    '-mgp32',
    '-mfp32',
    '-G0',
    '-L$PS2SDK/ee/lib',
    '-L$PS2SDK/common/lib',
    '-lfileXio',
    '-lmc',
    '-lpad',
    '-laudsrv',
    '-lSDL',
    '-lSDL_ttf',
    '-lSDL_mixer',
    '-lpatches',
    '-lc',
    '-lkernel',
]

[host_machine]
system = 'ps2'
cpu_family = 'mips'
cpu = 'r5900'
endian = 'little'
