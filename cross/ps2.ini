[binaries]
c = 'mips64r5900el-ps2-elf-gcc'
cpp = 'mips64r5900el-ps2-elf-g++'
ar = 'mips64r5900el-ps2-elf-ar'
strip = 'mips64r5900el-ps2-elf-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-D_EE', '-G0', '-O2', '-fno-builtin', '-fno-math-errno', '-ffp-contract=off']
cpp_args = ['-D_EE', '-G0', '-O2', '-Dmain=SDL_main', '-fno-builtin', '-fno-math-errno', '-ffp-contract=off']
c_link_args = ['-T$PS2SDK/ee/startup/linkfile', '-L$PS2SDK/ee/lib', '-L$PS2SDK/ports/lib', '-L$PS2DEV/gsKit/lib', '-Wl,--whole-archive', '-lSDL2main', '-Wl,--no-whole-archive', '-Wl,-z,noexecstack']
cpp_link_args = ['-T$PS2SDK/ee/startup/linkfile', '-L$PS2SDK/ee/lib', '-L$PS2SDK/ports/lib', '-L$PS2DEV/gsKit/lib', '-Wl,--whole-archive', '-lSDL2main', '-Wl,--no-whole-archive', '-Wl,-z,noexecstack']
default_library = 'static'
buildtype = 'release'
cpp_std = 'c++23'

[host_machine]
system = 'none'
cpu_family = 'mips64'
cpu = 'r5900'
endian = 'little'
