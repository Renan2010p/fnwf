[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkgconfig = 'x86_64-w64-mingw32-pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
c_args = ['-O3', '-flto', '-march=x86-64-v2', '-D_FORTIFY_SOURCE=3']
cpp_args = ['-O3', '-flto', '-march=x86-64-v2', '-D_FORTIFY_SOURCE=3']
c_link_args = ['-O3', '-flto']
cpp_link_args = ['-O3', '-flto']
