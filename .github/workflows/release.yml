name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VER=$(grep "version" meson.build | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build g++ pkg-config \
            cmake curl ca-certificates \
            libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libudev-dev libpipewire-0.3-dev libdecor-0-dev

      - name: Build SDL2 from source
        run: |
          chmod +x bootstrap.sh
          ./bootstrap.sh

      - name: Build game
        run: |
          export PKG_CONFIG_PATH="$(pwd)/deps/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="$(pwd)/deps/lib:$LD_LIBRARY_PATH"
          meson setup build --buildtype=release
          meson compile -C build

      - name: Package
        run: |
          VER="${{ steps.version.outputs.tag }}"
          RELEASE="fnwf-classic-${VER}-linux-x86_64"
          mkdir -p "release/${RELEASE}"
          cp build/fnwf "release/${RELEASE}/"
          cp -r assets "release/${RELEASE}/"
          chmod +x "release/${RELEASE}/fnwf"
          cd release && tar czf "${RELEASE}.tar.gz" "${RELEASE}"

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          name: "FNWF ${{ steps.version.outputs.tag }}"
          files: release/fnwf-classic-*-linux-x86_64.tar.gz
          draft: false
          prerelease: false
