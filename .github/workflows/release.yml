name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++ pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            ffmpeg zip

      - name: Generate sounds
        run: bash generate_sounds.sh

      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Package
        run: |
          mkdir -p release/fnwf-linux
          cp build/fnwf release/fnwf-linux/
          cp -r assets release/fnwf-linux/
          cp LICENSE release/fnwf-linux/
          cp README.md release/fnwf-linux/
          cp run.sh release/fnwf-linux/
          chmod +x release/fnwf-linux/run.sh release/fnwf-linux/fnwf

          ldd build/fnwf | grep -o '/[^ ]*SDL[^ ]*' | while read lib; do
            cp "$lib" release/fnwf-linux/ 2>/dev/null || true
          done

          cd release
          tar czf fnwf-linux-${{ github.ref_name }}.tar.gz fnwf-linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnwf-linux
          path: release/fnwf-linux-${{ github.ref_name }}.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ffmpeg
            meson
            ninja
            git
            zip

      - name: Generate sounds
        run: bash generate_sounds.sh

      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Package
        run: |
          mkdir -p release/fnwf-windows
          cp build/fnwf.exe release/fnwf-windows/
          cp -r assets release/fnwf-windows/
          cp LICENSE release/fnwf-windows/
          cp README.md release/fnwf-windows/

          # Copy SDL2 DLLs
          for dll in $(ldd build/fnwf.exe | grep -o '/mingw64/bin/[^ ]*\.dll'); do
            cp "$dll" release/fnwf-windows/ 2>/dev/null || true
          done
          # Also grab them directly
          cp /mingw64/bin/SDL2.dll release/fnwf-windows/ 2>/dev/null || true
          cp /mingw64/bin/SDL2_ttf.dll release/fnwf-windows/ 2>/dev/null || true
          cp /mingw64/bin/SDL2_image.dll release/fnwf-windows/ 2>/dev/null || true
          cp /mingw64/bin/SDL2_mixer.dll release/fnwf-windows/ 2>/dev/null || true

          cd release
          zip -r fnwf-windows-${{ github.ref_name }}.zip fnwf-windows/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnwf-windows
          path: release/fnwf-windows-${{ github.ref_name }}.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fnwf-linux/fnwf-linux-*.tar.gz
            fnwf-windows/fnwf-windows-*.zip
          generate_release_notes: true
