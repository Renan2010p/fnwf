name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build g++ pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Package
        run: |
          mkdir -p release/fnwf-linux-x86_64
          cp build/fnwf release/fnwf-linux-x86_64/
          cp -r assets release/fnwf-linux-x86_64/
          chmod +x release/fnwf-linux-x86_64/fnwf
          cd release && tar czf fnwf-linux-x86_64.tar.gz fnwf-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnwf-linux-x86_64
          path: release/fnwf-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            meson ninja git zip

      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Package
        run: |
          mkdir -p release/fnwf-windows-x86_64
          cp build/fnwf.exe release/fnwf-windows-x86_64/
          cp -r assets release/fnwf-windows-x86_64/
          for dll in \
            /mingw64/bin/SDL2.dll \
            /mingw64/bin/SDL2_ttf.dll \
            /mingw64/bin/SDL2_image.dll \
            /mingw64/bin/SDL2_mixer.dll \
            /mingw64/bin/libfreetype-6.dll \
            /mingw64/bin/libpng16-16.dll \
            /mingw64/bin/zlib1.dll \
            /mingw64/bin/libharfbuzz-0.dll \
            /mingw64/bin/libbrotlidec.dll \
            /mingw64/bin/libbrotlicommon.dll \
            /mingw64/bin/libbz2-1.dll \
            /mingw64/bin/libtiff-6.dll \
            /mingw64/bin/libwebp-7.dll \
            /mingw64/bin/libjpeg-8.dll \
            /mingw64/bin/libogg-0.dll \
            /mingw64/bin/libvorbis-0.dll \
            /mingw64/bin/libvorbisfile-3.dll \
            /mingw64/bin/libopus-0.dll \
            /mingw64/bin/libFLAC-12.dll \
            /mingw64/bin/libmpg123-0.dll \
            /mingw64/bin/libsndfile-1.dll; do
            cp "$dll" release/fnwf-windows-x86_64/ 2>/dev/null || true
          done
          cd release && tar czf fnwf-windows-x86_64.tar.gz fnwf-windows-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnwf-windows-x86_64
          path: release/fnwf-windows-x86_64.tar.gz
