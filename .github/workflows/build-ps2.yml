name: Build PS2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ps2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VER=$(grep "version" meson.build | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=v${VER}--dev+${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Install ps2dev (pre-built toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget curl cmake pkg-config genisoimage
          sudo mkdir -p /opt/ps2dev
          curl -sL -o /tmp/ps2dev.tar.gz \
            "https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz"
          sudo tar xzf /tmp/ps2dev.tar.gz --strip-components 1 -C /opt/ps2dev
          rm /tmp/ps2dev.tar.gz

          # Fix hardcoded CI paths in pkg-config files
          sudo sed -i'' "s|/__w/ps2dev/ps2dev/ps2dev/ps2sdk|${PS2SDK:-/opt/ps2dev/ps2sdk}|g" \
            /opt/ps2dev/ps2sdk/ports/lib/pkgconfig/*.pc 2>/dev/null || true
          sudo sed -i'' "s|/__w/ps2dev/ps2dev/ps2dev/gsKit|${PS2DEV:-/opt/ps2dev}/gsKit|g" \
            /opt/ps2dev/gsKit/lib/pkgconfig/*.pc 2>/dev/null || true

          echo "PS2DEV=/opt/ps2dev" >> $GITHUB_ENV
          echo "PS2SDK=/opt/ps2dev/ps2sdk" >> $GITHUB_ENV
          echo "/opt/ps2dev/ee/bin" >> $GITHUB_PATH
          echo "/opt/ps2dev/bin" >> $GITHUB_PATH
          echo "/opt/ps2dev/ps2sdk/bin" >> $GITHUB_PATH

      - name: Install Meson
        run: pip3 install meson ninja

      - name: Build SDL2 for PS2
        run: |
          SDL2_VER="2.30.8"
          mkdir -p build_ps2
          curl -sL -o build_ps2/SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
          tar xzf build_ps2/SDL2.tar.gz -C build_ps2

          sed -i 's/static int vsync_handler(void)/static int vsync_handler(int dummy)/' \
            build_ps2/SDL2-${SDL2_VER}/src/render/ps2/SDL_render_ps2.c

          cd build_ps2/SDL2-${SDL2_VER}
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${PS2SDK}/ps2dev.cmake \
            -DCMAKE_INSTALL_PREFIX=${PS2SDK}/ports \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build
          sudo cmake --install build

      - name: Build libogg for PS2
        run: |
          OGG_VER="1.3.6"
          mkdir -p build_ps2
          curl -fsSL -o build_ps2/libogg.tar.gz \
            "https://github.com/xiph/ogg/releases/download/v${OGG_VER}/libogg-${OGG_VER}.tar.gz"
          tar xzf build_ps2/libogg.tar.gz -C build_ps2
          cd build_ps2/libogg-${OGG_VER}
          rm -rf build
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${PS2SDK}/ps2dev.cmake \
            -DCMAKE_INSTALL_PREFIX=${PS2SDK}/ports \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build
          sudo cmake --install build

      - name: Build SDL2_mixer for PS2 (manual compilation with -G0)
        env:
          CC: mips64r5900el-ps2-elf-gcc
          AR: mips64r5900el-ps2-elf-ar
        run: |
          MIXER_VER="2.8.0"
          mkdir -p build_ps2

          # Remove pre-built SDL2_mixer entirely (lib, headers, pkgconfig)
          sudo rm -f ${PS2SDK}/ports/lib/libSDL2_mixer.a
          sudo rm -f ${PS2SDK}/ports/lib/pkgconfig/SDL2_mixer.pc
          sudo rm -f ${PS2SDK}/ports/include/SDL2/SDL_mixer.h

          # Download SDL2_mixer source
          curl -fsSL -o build_ps2/SDL2_mixer.tar.gz \
            "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${MIXER_VER}/SDL2_mixer-${MIXER_VER}.tar.gz"
          tar xzf build_ps2/SDL2_mixer.tar.gz -C build_ps2

          SRC=build_ps2/SDL2_mixer-${MIXER_VER}
          OBJDIR=build_ps2/mixer-objs
          mkdir -p $OBJDIR

          # Include paths (src and src/codecs per CMakeLists.txt)
          SDL2_INC=${PS2SDK}/ports/include/SDL2
          MIXER_INC=${SRC}/include
          OGG_INC=${PS2SDK}/ports/include

          DEFS="-DBUILD_SDL -DSDL_BUILD_MAJOR_VERSION=2 -DSDL_BUILD_MINOR_VERSION=8 -DSDL_BUILD_MICRO_VERSION=0 -DMUSIC_OGG -DOGG_USE_STB -DMUSIC_WAV"
          CFLAGS="-D_EE -G0 -O2 ${DEFS} -I${MIXER_INC} -I${SRC}/src -I${SRC}/src/codecs -I${SDL2_INC} -I${OGG_INC}"

          echo "=== Compiling SDL2_mixer sources with -G0 ==="
          echo "CFLAGS: $CFLAGS"
          echo "CC: mips64r5900el-ps2-elf-gcc"

          # Core sources
          SOURCES=""
          for f in ${SRC}/src/mixer.c ${SRC}/src/music.c ${SRC}/src/utils.c \
                   ${SRC}/src/effect_position.c ${SRC}/src/effect_stereoreverse.c \
                   ${SRC}/src/effects_internal.c; do
            SOURCES="$SOURCES $f"
          done

          # Codec sources (only what we need)
          for f in ${SRC}/src/codecs/music_ogg_stb.c ${SRC}/src/codecs/music_wav.c \
                   ${SRC}/src/codecs/mp3utils.c ${SRC}/src/codecs/load_aiff.c \
                   ${SRC}/src/codecs/load_voc.c; do
            [ -f "$f" ] && SOURCES="$SOURCES $f"
          done

          echo "Source files:$SOURCES"

          FAIL=0
          for f in $SOURCES; do
            base=$(basename "$f" .c)
            echo "Compiling $f ..."
            if ! mips64r5900el-ps2-elf-gcc $CFLAGS -c "$f" -o "${OBJDIR}/${base}.o"; then
              echo "ERROR: Failed to compile $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

          # Create static library
          echo "=== Creating libSDL2_mixer.a ==="
          mips64r5900el-ps2-elf-ar rcs ${OBJDIR}/libSDL2_mixer.a ${OBJDIR}/*.o

          # Verify no GOT relocations
          echo "=== Checking for GOT relocations ==="
          mips64r5900el-ps2-elf-readelf -r ${OBJDIR}/libSDL2_mixer.a 2>/dev/null | grep -c "R_MIPS_GOT_PAGE\|R_MIPS_CALL16" && echo "ERROR: GOT relocations found!" || echo "OK: No GOT relocations"

          # Install library and headers
          sudo cp ${OBJDIR}/libSDL2_mixer.a ${PS2SDK}/ports/lib/libSDL2_mixer.a
          sudo cp ${SRC}/include/SDL_mixer.h ${PS2SDK}/ports/include/SDL2/SDL_mixer.h

          echo "=== Installed library ==="
          ls -la ${PS2SDK}/ports/lib/libSDL2_mixer.a
          ls -la ${PS2SDK}/ports/include/SDL2/SDL_mixer.h

          # Re-create the pkg-config file
          sudo mkdir -p ${PS2SDK}/ports/lib/pkgconfig
          sudo tee ${PS2SDK}/ports/lib/pkgconfig/SDL2_mixer.pc << 'PCFILE'
          prefix=/opt/ps2dev/ps2sdk/ports
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: SDL2_mixer
          Description: SDL2 Mixer
          Version: 2.8.0
          Requires: sdl2
          Libs: -L${libdir} -lSDL2_mixer
          Cflags: -I${includedir}
          PCFILE

      - name: Build game for PS2
        run: |
          # Resolve $PS2SDK and $PS2DEV in cross file (linker can't expand env vars)
          sed -i "s|\$PS2SDK|${PS2SDK}|g" cross/ps2.ini
          sed -i "s|\$PS2DEV|${PS2DEV}|g" cross/ps2.ini

          export PKG_CONFIG_PATH=${PS2SDK}/ports/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          meson setup build_ps2/game --cross-file cross/ps2.ini
          meson compile -C build_ps2/game -v

          # Verify ELF
          ELF=$(find build_ps2/game -name 'fnwf' -o -name 'fnwf.elf' | head -1)
          echo "=== ELF info ==="
          file "$ELF" 2>/dev/null || true
          mips64r5900el-ps2-elf-readelf -h "$ELF" 2>/dev/null || true
          mips64r5900el-ps2-elf-readelf -l "$ELF" 2>/dev/null || true
          mips64r5900el-ps2-elf-nm "$ELF" 2>/dev/null | grep -E "main|_start|SDL_main" || true

          # Restore cross file
          git checkout cross/ps2.ini

      - name: Package
        run: |
          set -e
          mkdir -p "release_ps2"
          ELF=$(find build_ps2/game -name 'fnwf' -o -name 'fnwf.elf' | head -1)
          echo "ELF found: ${ELF}"
          ls -la "${ELF}"

          # Create ISO disc structure
          DISC_DIR="build_ps2/disc"
          rm -rf "${DISC_DIR}"
          mkdir -p "${DISC_DIR}/assets"

          # SYSTEM.CNF for PS2 disc boot
          echo "BOOT2 = cdrom0:\FNWF.ELF;1" > "${DISC_DIR}/SYSTEM.CNF"
          echo "VER = 1.00" >> "${DISC_DIR}/SYSTEM.CNF"
          echo "VMODE = NTSC" >> "${DISC_DIR}/SYSTEM.CNF"
          cat "${DISC_DIR}/SYSTEM.CNF"

          # Copy ELF as FNWF.ELF (PS2 convention: uppercase, 8.3)
          cp "${ELF}" "${DISC_DIR}/FNWF.ELF"
          ls -la "${DISC_DIR}/FNWF.ELF"

          # Copy assets directory
          cp -r assets/* "${DISC_DIR}/assets/"
          echo "=== Disc contents ==="
          find "${DISC_DIR}" -type f | head -30

          # Generate ISO9660 disc image (PS2 needs -no-pad, no Joliet)
          echo "=== Creating PS2 ISO ==="
          genisoimage -iso-level 2 -no-pad \
            -o "release_ps2/fnwf-ps2.iso" \
            -V "FNWF" \
            "${DISC_DIR}"
          echo "=== ISO result: $? ==="
          ls -la "release_ps2/fnwf-ps2.iso"

          # Also keep raw ELF
          cp "${ELF}" release_ps2/fnwf.elf

          echo "=== Final release_ps2 contents ==="
          ls -la release_ps2/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnwf-ps2
          path: release_ps2/
